# Netlify hanya menerbitkan isi folder public/.
# Folder supabase/ (berisi HPP di seed_katalog.sql) TIDAK ikut terbit.
[build]
  publish = "public"

# Fungsi server (kurs dolar harian). Kodenya tidak ikut terbit sebagai file publik.
[functions]
  directory = "netlify/functions"

# Header keamanan untuk semua halaman
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

# Halaman admin jangan muncul di mesin pencari
[[headers]]
  for = "/admin-impor/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/garansi/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/mitra/saldo/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/ulasan/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
