<body>
<header class="atas">
  <div class="baris">
    <a class="merek" href="/admin/"><img src="/assets/brand/emblem-putih.png" alt="" width="274" height="183">PANEL ADMIN</a>
    <div class="akun hidden" id="akun"><span id="namaAkun"></span><button type="button" id="tombolKeluar">Keluar</button></div>
  </div>
</header>
<nav class="menu hidden" id="menu" aria-label="Menu admin">
  <div class="baris">
    <a href="#ringkasan">Ringkasan</a>
    <a href="#pesanan">Pesanan</a>
    <a href="#stok">Stok</a>

<main>
  <section class="card hidden" id="kartuLogin">
    <h2>Masuk sebagai admin</h2>
    <form id="formLogin" style="max-width:340px">
      <label class="f" for="email">Email</label><input id="email" type="email" autocomplete="username" required>
      <label class="f" for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
      <div class="row" style="margin-top:12px"><button type="submit">Masuk</button></div>
    </form>
    <div id="pesanLogin"></div>
  </section>
  <div id="halaman" aria-live="polite"></div>
</main>
<noscript><p style="padding:16px">Aktifkan JavaScript untuk memakai panel admin.</p></noscript>
