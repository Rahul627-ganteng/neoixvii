<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" width="720" height="405" role="img" aria-label="Lima bagian prompt: peran, tugas, konteks, format, contoh" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><rect width="720" height="405" rx="24" fill="#fbf7f5"/><text x="32" y="44" font-size="20" font-weight="800" fill="#1f1b1b" text-anchor="start">Anatomi prompt</text><text x="32" y="66" font-size="13" font-weight="500" fill="#5b5455" text-anchor="start">Lima bagian yang membuat jawaban AI lebih tepat</text><rect x="32" y="86" width="656" height="294" rx="18" fill="#fff" stroke="#e3dcdc" stroke-width="2"/><rect x="52" y="108" width="104" height="38" rx="10" fill="#1f3a93"/><text x="104" y="133" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Peran</text><rect x="168" y="108" width="500" height="38" rx="10" fill="#1f3a93" fill-opacity=".1"/><text x="184" y="133" font-size="14" font-weight="600" fill="#1f1b1b" text-anchor="start">Kamu copywriter toko online.</text><rect x="52" y="162" width="104" height="38" rx="10" fill="#2f6f9f"/><text x="104" y="187" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Tugas</text><rect x="168" y="162" width="500" height="38" rx="10" fill="#2f6f9f" fill-opacity=".1"/><text x="184" y="187" font-size="14" font-weight="600" fill="#1f1b1b" text-anchor="start">Tulis 5 caption Instagram</text><rect x="52" y="216" width="104" height="38" rx="10" fill="#2f9a80"/><text x="104" y="241" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Konteks</text><rect x="168" y="216" width="500" height="38" rx="10" fill="#2f9a80" fill-opacity=".1"/><text x="184" y="241" font-size="14" font-weight="600" fill="#1f1b1b" text-anchor="start">untuk template Canva toko kue, target ibu rumah tangga.</text><rect x="52" y="270" width="104" height="38" rx="10" fill="#d98a1f"/><text x="104" y="295" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Format</text><rect x="168" y="270" width="500" height="38" rx="10" fill="#d98a1f" fill-opacity=".1"/><text x="184" y="295" font-size="14" font-weight="600" fill="#1f1b1b" text-anchor="start">Maks. 80 kata, 1 emoji, akhiri dengan ajakan.</text><rect x="52" y="324" width="104" height="38" rx="10" fill="#9c1239"/><text x="104" y="349" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Contoh</text><rect x="168" y="324" width="500" height="38" rx="10" fill="#9c1239" fill-opacity=".1"/><text x="184" y="349" font-size="14" font-weight="600" fill="#1f1b1b" text-anchor="start">Gaya: "Feed rapi tanpa ribet, cukup ganti teks."</text></svg>