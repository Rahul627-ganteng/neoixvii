<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" width="720" height="405" role="img" aria-label="Contoh poster dengan urutan baca: judul, visual, ajakan" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><rect width="720" height="405" rx="24" fill="#fbf7f5"/><text x="32" y="44" font-size="20" font-weight="800" fill="#1f1b1b" text-anchor="start">Urutan mata membaca</text><text x="32" y="66" font-size="13" font-weight="500" fill="#5b5455" text-anchor="start">Judul → visual → ajakan</text><rect x="250" y="82" width="220" height="296" rx="16" fill="#fff" stroke="#e3dcdc" stroke-width="2"/><rect x="270" y="104" width="180" height="26" rx="5" fill="#5b2bd6"/><rect x="270" y="136" width="120" height="12" rx="4" fill="#cfc6f5"/><rect x="270" y="162" width="180" height="120" rx="12" fill="#efeafe"/><circle cx="360" cy="222" r="34" fill="#d9cffd"/><rect x="338" y="202" width="44" height="40" rx="8" fill="#b9a6fb"/><rect x="270" y="296" width="130" height="8" rx="4" fill="#e3dcdc"/><rect x="270" y="310" width="100" height="8" rx="4" fill="#e3dcdc"/><rect x="270" y="332" width="110" height="28" rx="14" fill="#ffb84d"/><path d="M460 117 C510 172, 500 192, 460 222 S400 312, 390 346" fill="none" stroke="#5b2bd6" stroke-width="2" stroke-dasharray="5 6"/><circle cx="460" cy="117" r="15" fill="#1f1b1b"/><text x="460" y="122" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="510" y="120" font-size="16" font-weight="700" fill="#1f1b1b" text-anchor="start">Judul tawaran</text><text x="510" y="140" font-size="13" font-weight="500" fill="#5b5455" text-anchor="start">paling besar, maks. 5 kata</text><circle cx="460" cy="222" r="15" fill="#1f1b1b"/><text x="460" y="227" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="510" y="220" font-size="16" font-weight="700" fill="#1f1b1b" text-anchor="start">Visual produk</text><text x="510" y="240" font-size="13" font-weight="500" fill="#5b5455" text-anchor="start">jelas, tidak tertutup teks</text><circle cx="390" cy="346" r="15" fill="#1f1b1b"/><text x="390" y="351" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="510" y="320" font-size="16" font-weight="700" fill="#1f1b1b" text-anchor="start">Ajakan</text><text x="510" y="340" font-size="13" font-weight="500" fill="#5b5455" text-anchor="start">warna aksen paling kontras</text><text x="32" y="140" font-size="15" font-weight="700" fill="#5b2bd6" text-anchor="start">Uji jempol:</text><text x="32" y="162" font-size="13" font-weight="500" fill="#5b5455" text-anchor="start">kecilkan desain seukuran</text><text x="32" y="180" font-size="13" font-weight="500" fill="#5b5455" text-anchor="start">jempol. Judul masih terbaca?</text></svg>