<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" width="720" height="405" role="img" aria-label="Diagram donat porsi pilar konten: edukasi 40 persen, cerita, bukti, dan penawaran masing-masing 20 persen" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><rect width="720" height="405" rx="24" fill="#fbf7f5"/><text x="32" y="44" font-size="20" font-weight="800" fill="#1f1b1b" text-anchor="start">Porsi pilar konten</text><text x="32" y="66" font-size="13" font-weight="500" fill="#5b5455" text-anchor="start">Dalam 30 hari, kira-kira 12 edukasi, 6 cerita, 6 bukti, 6 penawaran</text><circle cx="200" cy="232" r="104" fill="none" stroke="#2f6f3a" stroke-width="44" stroke-dasharray="258.4 395.1" stroke-dashoffset="0.0" transform="rotate(-90 200 232)"/><circle cx="200" cy="232" r="104" fill="none" stroke="#d98a1f" stroke-width="44" stroke-dasharray="127.7 525.8" stroke-dashoffset="-261.4" transform="rotate(-90 200 232)"/><circle cx="200" cy="232" r="104" fill="none" stroke="#2f6f9f" stroke-width="44" stroke-dasharray="127.7 525.8" stroke-dashoffset="-392.1" transform="rotate(-90 200 232)"/><circle cx="200" cy="232" r="104" fill="none" stroke="#9c1239" stroke-width="44" stroke-dasharray="127.7 525.8" stroke-dashoffset="-522.8" transform="rotate(-90 200 232)"/><text x="200" y="230" font-size="34" font-weight="800" fill="#1f1b1b" text-anchor="middle">30</text><text x="200" y="252" font-size="13" font-weight="600" fill="#5b5455" text-anchor="middle">hari</text><rect x="372" y="128" width="18" height="18" rx="5" fill="#2f6f3a"/><text x="402" y="143" font-size="17" font-weight="700" fill="#1f1b1b" text-anchor="start">Edukasi · 40%</text><text x="402" y="165" font-size="13" font-weight="500" fill="#5b5455" text-anchor="start">tips, cara, kesalahan umum</text><rect x="372" y="192" width="18" height="18" rx="5" fill="#d98a1f"/><text x="402" y="207" font-size="17" font-weight="700" fill="#1f1b1b" text-anchor="start">Cerita · 20%</text><text x="402" y="229" font-size="13" font-weight="500" fill="#5b5455" text-anchor="start">di balik layar, perjalanan</text><rect x="372" y="256" width="18" height="18" rx="5" fill="#2f6f9f"/><text x="402" y="271" font-size="17" font-weight="700" fill="#1f1b1b" text-anchor="start">Bukti · 20%</text><text x="402" y="293" font-size="13" font-weight="500" fill="#5b5455" text-anchor="start">ulasan asli, hasil, proses</text><rect x="372" y="320" width="18" height="18" rx="5" fill="#9c1239"/><text x="402" y="335" font-size="17" font-weight="700" fill="#1f1b1b" text-anchor="start">Penawaran · 20%</text><text x="402" y="357" font-size="13" font-weight="500" fill="#5b5455" text-anchor="start">produk, promo, cara order</text></svg>