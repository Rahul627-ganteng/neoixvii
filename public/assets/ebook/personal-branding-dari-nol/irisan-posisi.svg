<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" width="720" height="405" role="img" aria-label="Diagram tiga lingkaran: yang kamu bisa, yang kamu suka, yang orang butuh; irisannya adalah posisimu" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><rect width="720" height="405" rx="24" fill="#fbf7f5"/><circle cx="330" cy="168" r="95" fill="#800203" fill-opacity=".16" stroke="#800203" stroke-width="2.5"/><circle cx="450" cy="168" r="95" fill="#d98a1f" fill-opacity=".16" stroke="#d98a1f" stroke-width="2.5"/><circle cx="390" cy="268" r="95" fill="#2f6f9f" fill-opacity=".16" stroke="#2f6f9f" stroke-width="2.5"/><text x="218" y="150" font-size="17" font-weight="700" fill="#800203" text-anchor="end">Yang kamu bisa</text><text x="218" y="170" font-size="13" font-weight="500" fill="#5b5455" text-anchor="end">keahlian &amp; pengalaman</text><text x="562" y="150" font-size="17" font-weight="700" fill="#d98a1f" text-anchor="start">Yang kamu suka</text><text x="562" y="170" font-size="13" font-weight="500" fill="#5b5455" text-anchor="start">topik yang tahan lama</text><text x="500" y="330" font-size="17" font-weight="700" fill="#2f6f9f" text-anchor="start">Yang orang butuh</text><text x="500" y="350" font-size="13" font-weight="500" fill="#5b5455" text-anchor="start">masalah yang mau dibayar</text><circle cx="390" cy="203" r="32" fill="#fff" stroke="#1f1b1b" stroke-width="2"/><text x="390" y="200" font-size="13" font-weight="800" fill="#1f1b1b" text-anchor="middle">Posisi</text><text x="390" y="216" font-size="13" font-weight="800" fill="#1f1b1b" text-anchor="middle">mu</text><text x="32" y="44" font-size="20" font-weight="800" fill="#1f1b1b" text-anchor="start">Irisan posisi</text><text x="32" y="66" font-size="13" font-weight="500" fill="#5b5455" text-anchor="start">Cari titik tengah dari tiga lingkaran</text></svg>