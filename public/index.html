<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ixvii.co — Segera hadir</title>
<meta name="description" content="ixvii.co: langganan aplikasi premium dengan harga hemat. Segera hadir.">
<style>
  :root { --maroon:#7a1f2b; --maroon-terang:#a83245; --gelap:#0e0e10; --abu:#1c1c20; --putih:#f5f5f7; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body {
    display:grid; place-items:center; padding:16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:var(--putih);
    background:
      radial-gradient(600px 400px at 20% 20%, rgba(122,31,43,.55), transparent 70%),
      radial-gradient(500px 380px at 85% 80%, rgba(168,50,69,.35), transparent 70%),
      var(--gelap);
  }
  .kartu {
    width:100%; max-width:440px; padding:40px 28px; text-align:center; border-radius:20px;
    background:rgba(28,28,32,.55); border:1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .logo { font-size:36px; font-weight:800; letter-spacing:-.02em; margin:0; }
  .logo span { color:var(--maroon-terang); }
  .judul { margin:18px 0 8px; font-size:20px; font-weight:600; }
  p { margin:0; color:rgba(245,245,247,.72); line-height:1.6; }
  .garis { width:56px; height:4px; border-radius:2px; background:var(--maroon); margin:20px auto 0; }
</style>
</head>
<body>
  <main class="kartu">
    <h1 class="logo">ixvii<span>.co</span></h1>
    <p class="judul">Segera hadir</p>
    <p>Langganan aplikasi premium (streaming, AI, editing, dan lainnya) dengan harga lebih hemat.</p>
    <div class="garis" aria-hidden="true"></div>
  </main>
</body>
</html>
