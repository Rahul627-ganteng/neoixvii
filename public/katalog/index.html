<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e0e10">
<script>
/* Pasang bahasa & tema sebelum halaman tampil supaya tidak berkedip. */
(function () {
  var d = document.documentElement, b = null, t = null, q = null;
  try { q = new URLSearchParams(location.search).get('lang'); } catch (e) {}
  try {
    if (q === 'en' || q === 'id') localStorage.setItem('ixvii-bahasa', q);
    b = localStorage.getItem('ixvii-bahasa'); t = localStorage.getItem('ixvii-tema');
  } catch (e) {}
  if (q === 'en' || q === 'id') b = q;
  if (b === 'en') { d.lang = 'en'; d.classList.add('terjemah'); setTimeout(function () { d.classList.remove('terjemah'); }, 2000); }
  if (t === 'terang') { d.setAttribute('data-tema', 'terang'); document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f4f4'); }
})();
</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/brand.css">
<link rel="stylesheet" href="/css/site.css">
<title data-t="judul.katalog">Katalog — IXVII.CO</title>
<meta name="description" data-t-content="meta.katalog" content="Semua aplikasi premium di IXVII.CO: streaming, AI, editing, edukasi, dan musik, lengkap dengan harga dan stok.">
<script type="module" src="/js/katalog.js"></script>
</head>
<body>
<header id="kepala" class="kepala"><div class="wadah"><a class="merek" href="/"><span>IXVII.CO</span></a></div></header>
<main class="wadah">
  <section class="seksi">
    <h1 class="judul-halaman" data-t="katalog.judul">Katalog</h1>
    <p class="redup sub-halaman" data-t="katalog.sub">Pilih kategori atau ketik nama aplikasi.</p>
    <div class="cari">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="tersembunyi" for="kotak-cari" data-t="katalog.cariLabel">Cari aplikasi</label>
      <input id="kotak-cari" type="search" placeholder="Cari Netflix, ChatGPT, Canva…" data-t-placeholder="katalog.cari" autocomplete="off">
    </div>
    <div class="chips" id="filter-kategori" role="group" aria-label="Filter kategori" data-t-aria="katalog.filter"></div>
  </section>
  <p class="info-hasil" id="info-hasil" aria-live="polite"></p>
  <div id="hasil"></div>
</main>
<footer id="kaki" class="kaki"></footer>
<noscript><p class="wadah">Aktifkan JavaScript untuk melihat katalog. / Please enable JavaScript to see the catalog.</p></noscript>
</body>
</html>
