<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Sedang offline · IXVII.CO</title>
<script>
  try { if (localStorage.getItem('ixvii-tema') === 'terang') document.documentElement.setAttribute('data-tema', 'terang'); } catch (e) {}
</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
<link rel="stylesheet" href="/css/brand.css">
<link rel="stylesheet" href="/css/site.css">
<style>
  .offline { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 32px 20px; }
  .offline .kaca { max-width: 420px; padding: 32px 26px; display: grid; gap: 14px; justify-items: center; }
  .offline img { width: 92px; height: auto; }
  .offline h1 { font-size: 22px; margin: 6px 0 0; }
  .offline p { margin: 0; color: var(--teks-2); }
</style>
</head>
<body>
<main class="offline">
  <div class="kaca">
    <img class="hanya-gelap" src="/assets/brand/emblem-putih.png" alt="IXVII.CO">
    <img class="hanya-terang" src="/assets/brand/emblem-hitam.png" alt="IXVII.CO">
    <h1>Kamu sedang offline</h1>
    <p>Sambungkan internet dulu, lalu coba lagi. Harga dan stok IXVII.CO selalu diambil langsung dari server, jadi butuh koneksi.</p>
    <button class="tombol" type="button" onclick="location.reload()">Coba lagi</button>
  </div>
</main>
</body>
</html>
